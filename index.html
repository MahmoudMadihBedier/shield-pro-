<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Shield Pro — ERP &amp; CRM</title>
    <script>
      // Resolve the theme before first paint to avoid a flash. "system" follows
      // the OS setting; an explicit choice is kept in localStorage.
      ;(function () {
        try {
          var stored = localStorage.getItem('shieldpro.theme') || 'system'
          var mql = window.matchMedia('(prefers-color-scheme: dark)')
          var effective = stored === 'system' ? (mql.matches ? 'dark' : 'light') : stored
          document.documentElement.dataset.theme = effective
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
